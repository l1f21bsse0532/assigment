<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample HTML Document</title>
</head>
<body>

    <header id="main-header">
        <h1>Welcome to My Website</h1>
        <nav>
            <ul>
                <li><a href="#about">About</a></li>
                <li><a href="#services">Services</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main id="main-content">
        <section id="about">
            <h2>About Us</h2>
            <p>We are a company dedicated to providing the best services.</p>
            <img src="team.jpg" alt="Our Team"> <!-- Alt attribute included -->
        </section>

        <section id="services">
            <h2>Our Services</h2>
            <p>We offer a variety of services to meet your needs.</p>
            <img src="services.jpg" alt="Services Overview"> <!-- Alt attribute included -->
        </section>

        <section id="contact">
            <h2>Contact Us</h2>
            <p>You can reach us via email or phone.</p>
        </section>
    </main>

    <footer id="main-footer">
        <p>&copy; 2025 My Website. All rights reserved.</p>
    </footer>

</body>
</html>
